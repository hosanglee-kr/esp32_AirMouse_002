<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Elite AirMouse S3 - Web Config</title>
  <link rel="stylesheet" href="/www/style.css" />
</head>
<body>
  <div class="wrap">
    <h1>Elite AirMouse S3 설정</h1>

    <section class="card">
      <h2>기본</h2>
      <div class="row">
        <label>DPI Level</label>
        <select id="dpi_level">
          <option value="1">1 (Low)</option>
          <option value="2">2 (Mid)</option>
          <option value="3">3 (High)</option>
        </select>
      </div>

      <div class="row">
        <label>Hard Click-Lock</label>
        <label class="chk">
          <input type="checkbox" id="hard_click_lock" />
          <span>클릭 후 150ms 완전 고정(outX/outY=0)</span>
        </label>
      </div>
    </section>

    <section class="card">
      <h2>PPT 키 매핑</h2>
      <p class="hint">키 이름으로 선택하면 내부적으로 (mod, key) 숫자값으로 저장됩니다.</p>

      <div class="grid">
        <div class="krow">
          <div class="kname">START</div>
          <div class="kctrl">
            <select class="mod" data-key="start"></select>
            <select class="key" data-key="start"></select>
          </div>
        </div>

        <div class="krow">
          <div class="kname">EXIT</div>
          <div class="kctrl">
            <select class="mod" data-key="exit"></select>
            <select class="key" data-key="exit"></select>
          </div>
        </div>

        <div class="krow">
          <div class="kname">NEXT</div>
          <div class="kctrl">
            <select class="mod" data-key="next"></select>
            <select class="key" data-key="next"></select>
          </div>
        </div>

        <div class="krow">
          <div class="kname">PREV</div>
          <div class="kctrl">
            <select class="mod" data-key="prev"></select>
            <select class="key" data-key="prev"></select>
          </div>
        </div>

        <div class="krow">
          <div class="kname">BLACK</div>
          <div class="kctrl">
            <select class="mod" data-key="black"></select>
            <select class="key" data-key="black"></select>
          </div>
        </div>

        <div class="krow">
          <div class="kname">LASER</div>
          <div class="kctrl">
            <select class="mod" data-key="laser"></select>
            <select class="key" data-key="laser"></select>
          </div>
        </div>
      </div>

      <details class="adv">
        <summary>고급: 숫자값 직접 입력(필요시)</summary>
        <p class="hint">드롭다운이 원하는 키를 못 찾을 때만 사용하세요.</p>
        <div class="row">
          <label>START mod,key</label>
          <input id="raw_start_mod" type="number" min="0" max="255" />
          <input id="raw_start_key" type="number" min="0" max="255" />
        </div>
      </details>
    </section>

    <section class="card">
      <h2>동작</h2>
      <div class="btns">
        <button id="btn_reload">불러오기</button>
        <button id="btn_save" class="primary">저장 + 적용</button>
        <button id="btn_reset">기본값 복원</button>
        <button id="btn_reboot">재부팅</button>
      </div>
      <pre id="log" class="log"></pre>
    </section>
  </div>

  <script src="/www/app.js"></script>
</body>
</html>
