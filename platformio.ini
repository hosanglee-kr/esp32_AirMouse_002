[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; 빌드/라이브러리 최적화
lib_archive = yes
build_cache_dir = .pio/cache
lib_ldf_mode = chain+

build_unflags = 
  -std=gnu++11
build_flags =
  -std=gnu++17
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CONFIG_BT_NIMBLE_ENABLED=1
  -D CONFIG_BT_BLE_ENABLED=1
  ; -std=gnu++17  ; 필요하면 아래 build_unflags와 같이 사용 권장

lib_deps =
  bblanchon/ArduinoJson @ ^7.4.2
  h2zero/NimBLE-Arduino @ ^2.3.7
  https://github.com/wakwak-koba/ESP32-NimBLE-Mouse.git
  https://github.com/wakwak-koba/ESP32-NimBLE-Keyboard.git
  adafruit/Adafruit MPU6050@^2.2.6
  ; electroniccats/MPU6050 @ ^1.4.4
  esp32async/ESPAsyncWebServer @ ^3.9.3
  