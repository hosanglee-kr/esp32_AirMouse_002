[platformio]
	default_envs 	= esp32-s3-zero
	build_cache_dir = .pio/cache
	data_dir        = ./src/v010/data_v010

[ESP32_common]
    platform 				= espressif32
    framework 				= arduino
    board_build.filesystem 	= littlefs
    monitor_speed 			= 115200
    monitor_filters 		= esp32_exception_decoder, colorize

	lib_archive 	= yes
	lib_ldf_mode 	= chain+
	lib_deps =
					bblanchon/ArduinoJson @ ^7.4.2

					h2zero/NimBLE-Arduino @ ^2.3.7
					https://github.com/Mystfit/ESP32-BLE-CompositeHID.git

					adafruit/Adafruit MPU6050@^2.2.6
					esp32async/ESPAsyncWebServer @ ^3.9.3


	build_unflags =
					-std=gnu++11
	build_flags =
					-std=gnu++17
					-D CONFIG_BT_NIMBLE_ENABLED=1
					-D CONFIG_BT_BLE_ENABLED=1

					; ✅ Joystick 옵션(0=없음, 1=있음)
					-D E10_HAS_JOYSTICK=0


    build_src_filter =
					+<*>
					-<src_backup/>


; --- 2. ESP32-S3 Zero ---
[env:esp32-s3-zero]
    extends 				= ESP32_common
    board 					= esp32-s3-devkitc-1
    board_build.mcu 		= esp32s3
    board_build.f_cpu 		= 240000000L
    board_build.f_flash 	= 80000000L
    board_build.flash_mode 	= qio
    board_upload.flash_size = 4MB
    board_build.partitions 	= default_4MB.csv

    ;lib_deps 				= ${ESP32_common.lib_deps}
    ;build_unflags 			= ${ESP32_common.build_unflags}
    build_flags =
							${ESP32_common.build_flags}

							-DBOARD_HAS_PSRAM
							-mfix-esp32-psram-cache-issue

							-D ARDUINO_USB_MODE=1
							-D ARDUINO_USB_CDC_ON_BOOT=1

    ;build_src_filter 		= ${ESP32_common.build_src_filter}


